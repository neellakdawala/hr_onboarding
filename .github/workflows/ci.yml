name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed the database
        run: python -m app.seed

      - name: Stage 1 - HRMS API endpoints
        run: python smoke_test.py

      - name: Stage 2 - agent graph structure
        run: python structure_test_stage2.py

      - name: Stage 3 - tools + intent routing
        run: python structure_test_stage3.py

      - name: Stage 4 - HITL + tracing
        run: python structure_test_stage4.py

      - name: Stage 5 - eval framework + scaffolding
        run: python structure_test_stage5.py
